$font = Mononoki Nerd Font

general {
    hide_cursor = true
}


background {
    monitor =
    path = /home/nano/.wal/hakase.jpg
    blur_passes = 0
}

input-field {
    monitor =
    size = 25%, 10%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(E80E50ee) 
    check_color = rgba(E80E50ee) 
    fail_color = rgba(DF9CA0ee) 

    font_color = rgb(17, 13, 18)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = パスワードを入力してください
    fail_text = $PAMFAIL

     dots_text_format = ^
     dots_size = 0.3
    dots_spacing = 0.3

    position = 40, 40
    halign = left
    valign = bottom
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font
    color = rgb(17, 13, 18)

    position = -40, 40
    halign = right
    valign = bottom
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font
    color = rgb(17, 13, 18)

    position = -40, 20
    halign = right
    valign = bottom
}

