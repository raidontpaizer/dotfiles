# MONITORS

monitor=,preferred,auto,auto

# MY PROGRAMS

$terminal = foot
$fileManager = dolphin
$menu = wofi --show drun
$rebar = bash /home/lain/.config/hypr/bar.sh
$grim = grim -g "$(slurp -o)"
$browser = firefox
$cubic = foot -e ocp
$lock = hyprlock
# AUTOSTART 

exec-once = mako
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = discord
exec-once = hyprctl setcursor Frieren 26
exec-once = steam
exec-once = mpvpaper HDMI-A-3  -o "--loop-file" ~/Videos/raidraid.mp4
exec-once = mpvpaper HDMI-A-1  -o "--loop-file" ~/Pictures/voyager.png
exec-once = openrgb -p yes --startminimized
exec-once = xrandr --output  HDMI-A-3 --primary
# ENVIRONMENT VARIABLES 

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_MENU_PREFIX,arch-

# LOOK AND FEEL

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 3
    col.active_border = rgb(e80e50)
    col.inactive_border = rgb(110d12)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 5
    active_opacity = 0.87
    inactive_opacity = 0.65
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = no
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
}


# INPUT

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0
    
}

# KEYBINDS

$mainMod = SUPER 

bind = $mainMod, W, exec, $terminal # open set terminal
bind = $mainMod, B, exec, $browser # open firefox
bind = $mainMod, Q, killactive, # kill active window
bind = $mainMod, N, exec, $fileManager # open set file manager
bind = $mainMod, F, togglefloating, # floating
bind = $mainMod, G, centerwindow, # center
bind = $mainMod SHIFT, F, fullscreen, # fullscreen
bind = $mainMod, D, exec, $menu # open wofi
bind = $mainMod SHIFT, R, exec, $rebar # restart waybar 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, S, exec, $grim # screenshot 
bind = $mainMod SHIFT, Q, exit #exit hyprland
bind = $mainMod, O, exec, $cubic
bind = $mainMod, H, moveactive, exact 0 850
bind = $mainMod, L, exec, $lock
# focus keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume Keys
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%-
