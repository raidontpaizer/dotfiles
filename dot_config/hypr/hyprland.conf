# WAL
source = ~/.cache/wal/colors-hyprland.conf

# MONITORS

monitor=DP-2,1280x1024@60.02,1920x28,1.0
monitor=DP-1,1920x1080@100,0x0,1.0

# MY PROGRAMS

$terminal = foot
$fileManager = dolphin
$menu = wofi --show drun
$rebar = bash /home/lain/.config/hypr/bar.sh
$veskt = bash /home/lain/.config/hypr/vesktop.sh
$scrt = hyprshot -z-o /home/lain/Pictures -m region
$browser = firefox-bin
$lock = hyprlock
# AUTOSTART 

exec-once = dbus-launch &
exec-once = dbus-daemon --session --address=unix:path=$XDG_RUNTIME_DIR/bus 
exec-once = gentoo-pipewire-launcher restart &
exec-once = mako
exec-once = /usr/libexec/hyprpolkitagent
exec-once = waybar
exec-once = $veskt
exec-once = hyprctl setcursor RagCatTheme 28
exec-once = steam
exec-once = swww-daemon
exec-once = openrgb -p yes --startminimized
exec-once = xrandr --output  HDMI-A-2 --primary
exec-once = qbittorrent
exec-once = cliphist wipe
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store 
# ENVIRONMENT VARIABLES 

env = HYPRCURSOR_THEME,RagCatTheme
env = XCURSOR_SIZE,28
env = HYPRCURSOR_SIZE,28
env = XDG_MENU_PREFIX,gentoo-
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
exec-once = dbus-update-activation-environment
exec-once = ~/.config/hypr/xdg-portal-hyprland 
# LOOK AND FEEL

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 3
    col.active_border = $color1
    col.inactive_border = $color4
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 3
    rounding_power = 5
    active_opacity = 0.87
    inactive_opacity = 0.65
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = no
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
}


# INPUT

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0
    
}

# WORKSPACES

#5:4 disp
workspace = 5, monitor:DP-2, default:true, persistent:true
workspace = 6, monitor:DP-2, persistent:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-2, persistent:true

#newdell
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true

workspace = special:moss, eson-created-empty:vesktop-bin
# KEYBINDS

$mainMod = SUPER 

bind = $mainMod, W, exec, $terminal # open set terminal
bind = $mainMod, B, exec, $browser # open firefox
bind = $mainMod, Q, killactive, # kill active window
bind = $mainMod, N, exec, $fileManager # open set file manager
bind = $mainMod, F, togglefloating, # floating
bind = $mainMod, G, centerwindow, # center
bind = $mainMod SHIFT, F, fullscreen, # fullscreen
bind = $mainMod, D, exec, $menu # open wofi
bind = $mainMod SHIFT, R, exec, $rebar # restart waybar 
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod SHIFT, S, exec, $scrt # screenshot 
bind = $mainMod SHIFT, Q, exec, nwg-bar #exit hyprland
bind = $mainMod, H, moveactive, exact 0 850
bind = $mainMod, L, exec, $lock
bind = SUPER, V, exec, cliphist list | wofi --dmenu --pre-display-cmd "echo '%s' | cut -f 2" | cliphist decode | wl-copy
# focus keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4

bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

bind = $mainMod, grave, togglespecialworkspace, moss
bind = $mainMod SHIFT, grave, movetoworkspace, special:moss
# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume Keys
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%-
